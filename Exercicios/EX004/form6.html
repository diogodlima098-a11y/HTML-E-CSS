<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="color">Cor:</label>
            <input type="color" name="color" id="icor" value="#00ff00">
        </p>
        <p>
            <label for="inivel">Nivel satisfação</label>
            <input type="range" name="nivel" id="inivel" min="1" max="10" value="3">
        </p>
        <p>
            <label for="iarq">enviar arquivo</label>
            <input type="file" name="arq" id="iarq">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
