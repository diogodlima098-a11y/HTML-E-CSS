<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div#conteiner {
            background-color: salmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div#itens {
            background-color: blue;
            border: 1px solid black;
            text-align: center;
        }

        div.cxa {
           flex: 0 1 200px;
        }
        div.cxb {
           flex: 1 0 200px;
        }
        div.cxc {
            flex: 1 1 200px;
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div id="itens" class="cxa">A</div>
        <div id="itens" class="cxb">B</div>
        <div id="itens" class="cxc">C</div>
    </div>
</body>
</html>
