<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div#conteiner {
            background-color: salmon;
            display: flex;
        }

        div#itens {
            background-color: blue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }

        div.i1 {
            order: 3;
        }
         div.i2 {
            order: 1;
        }
         div.i3 {
            order: -2;
        }
         div.i4 {
            order: 4;
        }
         div.i5 {
            order: 0;
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div id="itens" class="i1">A</div>
        <div id="itens" class="i2">B</div>
        <div id="itens" class="i3">C</div>
        <div id="itens" class="i4">D</div>
        <div id="itens" class="i5">E</div>
        <div id="itens" class="i6">F</div>
    </div>
</body>
</html>
