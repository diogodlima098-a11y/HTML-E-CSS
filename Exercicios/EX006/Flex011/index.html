<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div#conteiner {
            background-color: salmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div#itens {
            background-color: blue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 300px;
           
        }

        div.cxa {
            flex-shrink: 0;
            flex-grow: 0;
        }
        div.cxb {
            flex-shrink: 0;
            flex-grow: 1;
        }
        div.cxc {
            flex-shrink: 0;
            flex-grow: 0;
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div id="itens" class="cxa">A</div>
        <div id="itens" class="cxb">B</div>
        <div id="itens" class="cxc">C</div>
    </div>
</body>
</html>
