<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div#conteiner {
            background-color: salmon;
            display: flex;
            flex-flow: row wrap;
        }

        div#itens {
            background-color: blue;
            border: 1px solid black;
            text-align: center;
            flex: auto;
            
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div id="itens">Exemplo de bloco A</div>
        <div id="itens">Exemplo de bloco B</div>
        <div id="itens">Exemplo de bloco C</div>
        <div id="itens">Exemplo de bloco D</div>
        <div id="itens">Exemplo de bloco E</div>
        <div id="itens">Exemplo de bloco F</div>

    </div>
</body>
</html>
