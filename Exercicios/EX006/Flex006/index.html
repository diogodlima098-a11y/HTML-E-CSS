<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div#conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row wrap;
            align-content: center;
            height: 400px;
        }

        div#itens {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div id="itens">A</div>
        <div id="itens">B</div>
        <div id="itens">C</div>
        <div id="itens">D</div>
        <div id="itens">E</div>
        <div id="itens">F</div>
        <div id="itens">G</div>
        <div id="itens">H</div>
        <div id="itens">I</div>
        <div id="itens">J</div>

    </div>
</body>
</html>
