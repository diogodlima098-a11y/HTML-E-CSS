<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div#conteiner {
            background-color: salmon;
            display: flex;
            flex-flow: row nowrap;
            justify-content: space-around;
            align-items: center;
            height: 600px;
        }

        div#itens {
            background-color: lightblue;
            border: 1px solid black;
            
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div id="itens">A</div>
        <div id="itens">B</div>
        <div id="itens">C</div>
        <div id="itens">D</div>
        <div id="itens">E</div>
        <div id="itens">F</div>

    </div>
</body>
</html>
